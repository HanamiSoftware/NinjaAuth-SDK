name: Browser E2E

on:
  pull_request:
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsup.config.ts"
      - ".github/workflows/browser-e2e.yml"
  push:
    branches:
      - dev
    paths:
      - "src/**"
      - "e2e/**"
      - "playwright.config.mjs"
      - "package.json"
      - "package-lock.json"
      - "tsup.config.ts"
      - ".github/workflows/browser-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium:
    name: Chromium desktop and mobile browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Build SDK
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Upload browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ninja-auth-browser-e2e-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
